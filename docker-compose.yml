services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: Kafka no longer needs Zookeeper (the recommended default
      # since Kafka 3.x). This single container acts as both broker and
      # controller ("combined mode") - sufficient for local development; in
      # production you would separate the broker and controller roles.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Two listeners: one for communication inside the Docker network
      # (other containers like Spark/producer reach it at "kafka:29092"),
      # and one for access from the host machine (Python code running
      # outside Docker reaches it at "localhost:9092").
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # For a single-broker cluster the replication factor must be 1
      # (you can't have more copies than there are brokers).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Deliberately disabled: topics should be created explicitly with a
      # deliberate partition count, not implicitly on first write with some
      # arbitrary default configuration.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: schema-registry
    ports:
      # Default Schema Registry port (8081) is already taken by kafka-ui's
      # host mapping (see comment there), so only the host-side port is
      # remapped to 8082 - inside the Docker network it's still reachable
      # at schema-registry:8081, same PLAINTEXT_HOST-style pattern as Kafka.
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Schema Registry isn't a separate database - it stores every
      # registered schema as a message in an internal Kafka topic
      # (_schemas), so it needs its own Kafka connection just like a
      # regular producer/consumer would.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      # Default would be 8080, but that's already taken by a container from
      # another project on this machine (see README) - not a Kafka-specific
      # concern, just a local port conflict.
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.8
    container_name: clickhouse
    # Without a limit, ClickHouse sizes its internal memory budget off the
    # full host memory (no cgroup constraint to detect otherwise) - fine
    # for our tiny data volume in practice, but an explicit bound is cheap
    # and avoids it ever competing unbounded with Kafka/Spark for host RAM.
    mem_limit: 2g
    ports:
      # 8123 = HTTP interface (used by the clickhouse-connect Python client),
      # 9000 = native TCP protocol (used by the clickhouse-client CLI below).
      - "8123:8123"
      - "9000:9000"
    environment:
      # Single-user local dev setup - no auth needed to keep this in line
      # with the rest of the stack (Kafka/Schema Registry are also
      # unauthenticated PLAINTEXT locally).
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      # ClickHouse's own recommended minimum for the nofile limit - without
      # this it can fail under load with "too many open files".
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Failures during this window don't count against retries - without
      # it, a slower first-time startup (e.g. fresh data directory) could
      # get marked unhealthy before ClickHouse has actually finished
      # starting.
      start_period: 30s

volumes:
  kafka-data:
  clickhouse-data:
